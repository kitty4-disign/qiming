# ============================================
# DeepTutor Docker Compose Configuration
# ============================================
# This file provides orchestration for DeepTutor services
#
# Usage:
#   Production:  python scripts/docker_compose.py up -d
#   Development: python scripts/docker_compose.py -f docker-compose.yml -f docker-compose.dev.yml up
#   Build only:  python scripts/docker_compose.py build
#
# Prerequisites:
#   1. Runtime settings are stored in ./data/user/settings (created automatically)
#   2. Configure model providers from the web Settings page or model_catalog.json
#   3. Use scripts/docker_compose.py so port mappings are rendered from system.json
#   4. Set DEEPTUTOR_SANDBOX_RUNNER_TOKEN to a strong random value if exec/code tools are needed.
#
# Safe exposure defaults:
#   Published host ports bind to 127.0.0.1. To expose through a trusted reverse
#   proxy/network, explicitly set DEEPTUTOR_DOCKER_BIND_HOST and enable auth.
#   Auth-disabled remote exposure is rejected unless the deployer also sets
#   DEEPTUTOR_ACK_UNAUTHENTICATED_REMOTE=1 as an explicit unsafe acknowledgement.
#
# Local LLM (LM Studio / Ollama / vLLM):
#   Use "host.docker.internal" instead of "localhost" in provider base_url fields.
#   Configure provider endpoints in data/user/settings/model_catalog.json or the UI.
# ============================================

services:
  # ============================================
  # PocketBase — optional auth + storage sidecar
  # Set integrations.pocketbase_url=http://pocketbase:8090 to activate.
  # Leave integrations.pocketbase_url blank to run without PocketBase (SQLite fallback).
  # ============================================
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "${DEEPTUTOR_DOCKER_BIND_HOST:-127.0.0.1}:${DEEPTUTOR_DOCKER_POCKETBASE_PORT:-8090}:8090"
    volumes:
      - ./data/pocketbase:/pb_data
      - ./data/pocketbase/public:/pb_public
      - ./data/pocketbase/hooks:/pb_hooks
    networks:
      - deeptutor-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # All-in-One DeepTutor Service
  # ============================================
  deeptutor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: deeptutor
    restart: unless-stopped
    ports:
      - "${DEEPTUTOR_DOCKER_BIND_HOST:-127.0.0.1}:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}"
      - "${DEEPTUTOR_DOCKER_BIND_HOST:-127.0.0.1}:${DEEPTUTOR_DOCKER_FRONTEND_PORT:-3782}:${DEEPTUTOR_DOCKER_FRONTEND_PORT:-3782}"

    volumes:
      # Everything DeepTutor persists lives under ./data — one tree to mount
      # and back up: admin workspace + runtime settings (data/user), per-user
      # workspaces (data/users), partners (data/partners), accounts/grants/
      # audit (data/system), knowledge bases, memory.
      - ./data:/app/data

    environment:
      # Tell the API the host-facing publish address. The backend itself binds
      # 0.0.0.0 inside the container for bridge networking, so this value is the
      # address that matters for accidental LAN/public exposure checks.
      - DEEPTUTOR_EXPOSURE_HOST=${DEEPTUTOR_DOCKER_BIND_HOST:-127.0.0.1}
      # Deliberate escape hatch only. Leave empty in normal deployments.
      - DEEPTUTOR_ACK_UNAUTHENTICATED_REMOTE=${DEEPTUTOR_ACK_UNAUTHENTICATED_REMOTE:-}
      # Route untrusted shell exec to the runner sidecar (SYSTEM isolation).
      - DEEPTUTOR_SANDBOX_RUNNER_URL=http://sandbox-runner:8900
      # /exec fails closed when this is empty. Use the same strong secret on
      # both containers; it is never exposed as a published port.
      - DEEPTUTOR_SANDBOX_RUNNER_TOKEN=${DEEPTUTOR_SANDBOX_RUNNER_TOKEN:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    depends_on:
      pocketbase:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy

    networks:
      - deeptutor-network

  # ============================================
  # Sandbox Runner Sidecar
  # ============================================
  sandbox-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: deeptutor-sandbox-runner
    restart: unless-stopped

    # The runner is not published to the host. Its /exec endpoint additionally
    # requires the shared bearer token below. Cross-user workspace visibility
    # remains a filesystem limitation of this single-runner deployment; product
    # policy should keep non-admin exec explicitly granted rather than implicit.
    volumes:
      - ./data/user/workspace:/app/data/user/workspace
      - ./data/users:/app/data/users

    environment:
      - DEEPTUTOR_SANDBOX_RUNNER_TOKEN=${DEEPTUTOR_SANDBOX_RUNNER_TOKEN:-}

    # No `ports:` — intentionally not published to the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/runner
    pids_limit: 256
    mem_limit: 1g

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8900/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - deeptutor-network

# ============================================
# Networks
# ============================================
networks:
  deeptutor-network:
    driver: bridge
